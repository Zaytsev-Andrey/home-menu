spring:
  application:
    name: "${name}"

  datasource:
    hikari:
      auto-commit: false
      minimum-idle: 20
      maximum-pool-size: 20

  jpa:
    properties:
      hibernate.generate_statistics: true
      hibernate.connection.provider_disables_autocommit: true

  data:
    web:
      pageable:
        max-page-size: 200

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  otlp:
    metrics:
      export:
        enabled: false    # you already use Prometheus pull for metrics
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "http://alloy:4317"
          transport: grpc
  observations:
    annotations:
      enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: "${name}"
        version: "${version}"

app:
  http-error-message:
    constraints:
      uc_recipe_title:
        title: must be unique
      uc_ingredient_title:
        title: must be unique
      uc_recipe_ingredient_recipe_ingredient:
        ingredient: ingredient already exists in recipe
      fk_recipe_ingredient_on_ingredient:
        ingredient_id: Recipe is using ingredient
      chk_recipe_ingredient_quantity_positive:
        quantity: must be positive
    unknown-constraint-message: Constraint violation error

  recipe:
    max-recipe-ingredients: 200