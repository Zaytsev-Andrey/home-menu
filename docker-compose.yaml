services:

  postgres:
    image: postgres:17.9
    container_name: recipe-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipe_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - home-menu
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c pg_stat_statements.track_utility=off
      -c compute_query_id=auto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipe_service_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:password@postgres:5432/recipe_service_db?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - home-menu
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.2
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./docker/redis/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    networks:
      - home-menu
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-exporter:
    image: oliver006/redis_exporter:v1.83.0
    container_name: redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "9121:9121"
    networks:
      - home-menu
    depends_on:
      - redis

  recipe-service:
    deploy:
      replicas: ${DB_REPLICAS:-1}
    build:
      context: .
      dockerfile: recipe-service/Dockerfile
    container_name: recipe-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alloy:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/recipe_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"
    networks:
      - home-menu
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 20

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/config/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - home-menu
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.103.0
    container_name: victoriametrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=7"
    volumes:
      - victoriametrics_data:/storage
    networks:
      - home-menu
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8428/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:main-684b357
    container_name: tempo
    command: [ "-config.file=/etc/tempo/tempo-config.yaml" ]
    volumes:
      - ./docker/tempo/config/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - home-menu

  alloy:
    image: grafana/alloy:v1.16.0
    container_name: alloy
    user: root
    ports:
      - "9080:9080"
      - "4317:4317"
    volumes:
      - ./docker/alloy/config/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      - home-menu
    depends_on:
      loki:
        condition: service_healthy
      victoriametrics:
        condition: service_started
      tempo:
        condition: service_started

  grafana:
    image: grafana/grafana:12.3
    container_name: grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - home-menu
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  loki_data:
  victoriametrics_data:
  tempo-data:
  grafana_data:

networks:
  home-menu:
    name: home-menu-network
    driver: bridge